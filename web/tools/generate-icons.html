<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>图标生成器 - 我的世界坐标记录</title>
<style>
  body { font-family: system-ui, sans-serif; background: #0f0f1a; color: #e8e8f0; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; }
  h1 { margin-bottom: 8px; }
  p { color: #a0a0c0; margin-bottom: 24px; }
  canvas { border: 2px solid #2e2e5a; border-radius: 12px; margin: 12px 0; background: #1a1a2e; }
  .btn { padding: 10px 24px; background: #3b82f6; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 15px; margin: 8px; }
  .btn:hover { background: #2563eb; }
  .preview { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; justify-content: center; }
  .preview-item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .preview-item span { color: #a0a0c0; font-size: 13px; }
</style>
</head>
<body>
  <h1>🧊 生成 PWA 图标</h1>
  <p>点击下方按钮生成 192x192 和 512x512 的 PNG 图标</p>

  <canvas id="iconCanvas" width="512" height="512"></canvas>

  <div>
    <button class="btn" onclick="generateAndDownload(192)">⬇️ 下载 192x192</button>
    <button class="btn" onclick="generateAndDownload(512)">⬇️ 下载 512x512</button>
  </div>

  <div class="preview" style="margin-top:24px">
    <div class="preview-item">
      <img id="preview192" width="96" height="96">
      <span>192x192</span>
    </div>
    <div class="preview-item">
      <img id="preview512" width="96" height="96">
      <span>512x512</span>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('iconCanvas');
    const ctx = canvas.getContext('2d');

    function drawIcon(size) {
      const s = size || 512;
      canvas.width = s;
      canvas.height = s;

      // 背景
      const grad = ctx.createLinearGradient(0, 0, s, s);
      grad.addColorStop(0, '#1a1a2e');
      grad.addColorStop(1, '#0f0f1a');
      ctx.fillStyle = grad;
      const r = s * 0.15;
      ctx.beginPath();
      ctx.moveTo(r, 0);
      ctx.lineTo(s - r, 0);
      ctx.quadraticCurveTo(s, 0, s, r);
      ctx.lineTo(s, s - r);
      ctx.quadraticCurveTo(s, s, s - r, s);
      ctx.lineTo(r, s);
      ctx.quadraticCurveTo(0, s, 0, s - r);
      ctx.lineTo(0, r);
      ctx.quadraticCurveTo(0, 0, r, 0);
      ctx.closePath();
      ctx.fill();

      const m = s * 0.12;  // margin
      const half = s / 2;
      const gap = s * 0.01;
      const bs = (s - 2*m - gap) / 2; // block size

      // 草地砖块
      const blocks = [
        { x: m, y: m, fill: '#3a6b1e', stroke: '#2d5016' },
        { x: m + bs + gap, y: m, fill: '#2d5016', stroke: '#1a3a0a' },
        { x: m, y: m + bs + gap, fill: '#2d5016', stroke: '#1a3a0a' },
        { x: m + bs + gap, y: m + bs + gap, fill: '#3a6b1e', stroke: '#2d5016' },
      ];

      blocks.forEach(b => {
        ctx.fillStyle = b.fill;
        ctx.strokeStyle = b.stroke;
        ctx.lineWidth = s * 0.008;
        const br = s * 0.03;
        ctx.beginPath();
        ctx.roundRect(b.x, b.y, bs, bs, br);
        ctx.fill();
        ctx.stroke();
      });

      // 指南针
      const cx = half, cy = half;
      const compassR = s * 0.17;
      ctx.beginPath();
      ctx.arc(cx, cy, compassR, 0, Math.PI * 2);
      ctx.strokeStyle = '#3b82f6';
      ctx.lineWidth = s * 0.02;
      ctx.stroke();

      // 中心点
      ctx.beginPath();
      ctx.arc(cx, cy, s * 0.03, 0, Math.PI * 2);
      ctx.fillStyle = '#3b82f6';
      ctx.fill();

      // 红色指针 (北)
      ctx.beginPath();
      ctx.moveTo(cx, cy - compassR * 0.9);
      ctx.lineTo(cx, cy);
      ctx.strokeStyle = '#ef4444';
      ctx.lineWidth = s * 0.025;
      ctx.lineCap = 'round';
      ctx.stroke();

      // 白色指针 (东)
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + compassR * 0.7, cy + compassR * 0.3);
      ctx.strokeStyle = '#e8e8f0';
      ctx.lineWidth = s * 0.02;
      ctx.stroke();

      return canvas;
    }

    function generateAndDownload(size) {
      drawIcon(size);
      const link = document.createElement('a');
      link.download = `icon-${size}.png`;
      link.href = canvas.toDataURL('image/png');
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      // 恢复预览视图
      drawIcon(512);
      updatePreviews();
    }

    function updatePreviews() {
      drawIcon(192);
      document.getElementById('preview192').src = canvas.toDataURL();
      drawIcon(512);
      document.getElementById('preview512').src = canvas.toDataURL();
    }

    // 初始化预览
    drawIcon(512);
    updatePreviews();
  </script>
</body>
</html>
